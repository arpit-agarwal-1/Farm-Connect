
<mat-toolbar class="fc-toolbar" role="navigation" aria-label="Primary">
 
    <a class="fc-title" routerLink="/home" aria-label="FarmConnect Home">
      <mat-icon class="fc-title-icon" aria-hidden="true">agriculture</mat-icon>
      <span>FarmConnect</span>
    </a>
  
    <span class="fc-spacer"></span>
  
  
    <mat-chip-set class="fc-role">
      <mat-chip selected class="role-chip" aria-label="Role: Owner">
    
        {{userName}} / Owner
      </mat-chip>
    </mat-chip-set>
  

    <nav class="nav-desktop" aria-label="Main menu">
      <a mat-button routerLink="/home" aria-label="Home">
        <mat-icon aria-hidden="true">home</mat-icon>
        <span>Home</span>
      </a>
  

      <button
        mat-button
        [matMenuTriggerFor]="livestockMenu"
        aria-haspopup="true"
        aria-label="Livestock menu"
      >
        <mat-icon aria-hidden="true">pets</mat-icon>
        <span>Livestock</span>
      </button>
  
      <mat-menu #livestockMenu="matMenu">
        <button
          mat-menu-item
          [routerLink]="'/add-livestock'"
          aria-label="Add Livestock"
        >
          <mat-icon>add_circle</mat-icon>
          <span>Add Livestock</span>
        </button>
        <button
          mat-menu-item
          [routerLink]="'/view-livestock'"
          aria-label="View Livestock"
        >
          <mat-icon>visibility</mat-icon>
          <span>View Livestock</span>
        </button>
      </mat-menu>
  
      <a mat-button routerLink="/owner-viewfeed" aria-label="Feed">
        <mat-icon aria-hidden="true">restaurant</mat-icon>
        <span>Feed</span>
      </a>
  
      <a mat-button routerLink="/my-request" aria-label="My Request">
        <mat-icon aria-hidden="true">assignment</mat-icon>
        <span>My Request</span>
      </a>
    </nav>
  
   
    <button
      mat-raised-button
      color="warn"
      class="logout-btn"
      aria-label="Logout"
      (click)="openLogoutConfirm()"
    >
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span>Logout</span>
    </button>
  
 
    <button
      mat-icon-button
      class="menu-button"
      [matMenuTriggerFor]="mobileMenu"
      aria-label="Open menu"
    >
      <mat-icon>menu</mat-icon>
    </button>
  

    <mat-menu #mobileMenu="matMenu" xPosition="before">
      <button mat-menu-item routerLink="/home">
        <mat-icon>home</mat-icon>
        <span>Home</span>
      </button>
  
 
      <button mat-menu-item [matMenuTriggerFor]="mobileLivestockMenu">
        <mat-icon>pets</mat-icon>
        <span>Livestock</span>
    
      </button>
      <mat-menu #mobileLivestockMenu="matMenu">
        <button mat-menu-item routerLink="/livestock/add">
          <mat-icon>add_circle</mat-icon>
          <span>Add Livestock</span>
        </button>
        <button mat-menu-item routerLink="/livestock/view">
          <mat-icon>visibility</mat-icon>
          <span>View Livestock</span>
        </button>
      </mat-menu>
  
      <button mat-menu-item routerLink="/feed">
        <mat-icon>restaurant</mat-icon>
        <span>Feed</span>
      </button>
      <button mat-menu-item routerLink="/my-request">
        <mat-icon>assignment</mat-icon>
        <span>My Request</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="openLogoutConfirm()">
        <mat-icon color="warn">logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </mat-toolbar>
  

  <ng-template #logoutDialog>
    <h2 mat-dialog-title>
      <mat-icon style="vertical-align: middle; margin-right: 6px"
        >logout</mat-icon
      >
      Confirm Logout
    </h2>
  
    <mat-dialog-content>
      <p>Are you sure you want to log out?</p>
    </mat-dialog-content>
  
    <mat-dialog-actions align="end">

      <button mat-stroked-button type="button" [mat-dialog-close]="false">
        <mat-icon>close</mat-icon>
        Cancel
      </button>

      <button
        mat-raised-button
        color="warn"
        type="button"
        [mat-dialog-close]="true"
      >
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </mat-dialog-actions>
  </ng-template>
